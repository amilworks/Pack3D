<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PACK3D link-preview card</title>
<!--
  The link-preview card, website/social.png (1200 x 630): the paper's title over the logo, website/logo.svg
  (made by tools/logo.py), PACK3D in cubes of the closing word's colors, on the page's paper.

  Remake it from the repository root:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
      --allow-file-access-from-files --force-device-scale-factor=2 --window-size=1200,630 \
      --virtual-time-budget=3000 --user-data-dir=/tmp/pack3d-card --screenshot=/tmp/pack3d-card.png \
      "file://$PWD/tools/social_card.html"
    python3 -c "from PIL import Image; Image.open('/tmp/pack3d-card.png').convert('RGB').resize((1200, 630), Image.LANCZOS).save('website/social.png', optimize=True)"

  Then bump the ?v= on the og:image and twitter:image URLs in website/index.html, so that sites which
  cached the old card fetch the new one.
-->
<style>
@font-face { font-family: "Inter"; src: url(../website/fonts/inter-latin-standard-normal.woff2) format("woff2"); font-weight: 100 900; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #F4F4F4; color-scheme: light; }
.card {
  position: relative; width: 1200px; height: 630px; overflow: hidden; color: #111111;
  font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; font-optical-sizing: auto;
}
.head { position: absolute; left: 72px; right: 72px; top: 50px; }
.eyebrow { margin: 0; font-weight: 600; font-size: 21px; letter-spacing: 0.02em; color: #464646; }
h1 { margin: 12px 0 0; font-weight: 360; font-size: 56px; line-height: 1.04; letter-spacing: -0.032em; }
.by { margin: 14px 0 0; font-size: 20px; font-weight: 450; color: #464646; letter-spacing: -0.004em; }
.by b { color: #111111; font-weight: 550; }
/* the logo in the card's lower box, as large as fits */
.word { position: absolute; left: 72px; right: 72px; top: 250px; bottom: 56px; display: flex; align-items: center; justify-content: center; }
.word img { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <p class="eyebrow">NeurIPS 2026 · Sydney, Australia</p>
    <h1>Geometry Matters in Packed 3D Attention</h1>
    <p class="by"><b>Amil Khan</b> · <b>Anantajit Subrahmanya</b> · <b>B.S. Manjunath</b> · UC Santa Barbara</p>
  </div>
  <div class="word"><img src="../website/logo.svg" alt="PACK3D" onload="document.body.dataset.ready = '1'"></div>
</div>
</body>
</html>
