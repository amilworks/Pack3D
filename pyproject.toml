[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pack3d"
dynamic = ["version"]
description = "Geometry-aware local-global attention for packed 3D token fields (NeurIPS 2026)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
  {name = "Amil Khan"},
  {name = "Anantajit Subrahmanya"},
  {name = "B. S. Manjunath"},
]
keywords = [
  "attention", "transformer", "rotary position embedding", "RoPE", "3D",
  "volumetric segmentation", "microscopy", "pytorch",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
]
# Tested with PyTorch 2.11.0 (the paper's version) and 2.15.0. The exact environment used for the
# paper's reproduction runs is pinned separately in reproduce/constraints-tested.txt.
dependencies = ["torch>=2.11"]

[project.optional-dependencies]
# The GPU kernels were validated with Triton 3.6.0 on PyTorch 2.11.0.
triton = ["triton>=3.6; sys_platform == 'linux'"]
dev = ["pytest>=8", "build", "ruff", "pyyaml", "markdown-it-py", "twine"]
reproduce = ["numpy", "pyyaml", "monai", "scipy", "nibabel", "tifffile", "imagecodecs"]

[project.urls]
Homepage = "https://amilworks.github.io/Pack3D/"
Paper = "https://arxiv.org/abs/2610.38694"
Source = "https://github.com/amilworks/Pack3D"
Issues = "https://github.com/amilworks/Pack3D/issues"
Changelog = "https://github.com/amilworks/Pack3D/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "pack3d.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pack3d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
markers = ["cuda: explicitly enabled GPU correctness tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = ["reproduce/paper_backend", "website"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"src/pack3d/backends/triton/kernels.py" = ["E741"]
